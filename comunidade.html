<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIKING eSports Hub | Comunidade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-shield-halved highlight"></i>
            <span>VIKING <span class="highlight">HUB</span></span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="regras.html">Regras</a>
            <a href="modos.html">Modos</a>
            <a href="agenda.html">Agenda</a>
            <a href="ranking.html">Ranking</a>
            <a href="comunidade.html" class="highlight-link">Comunidade</a>
            <a href="perfil.html" id="nav-profile-link" class="highlight-link hidden"><i class="fa-solid fa-user"></i> Meu Perfil</a>
            <a href="#" id="nav-admin-link" class="highlight-link hidden" style="color: var(--gold-primary) !important;"><i class="fa-solid fa-lock"></i> ADM</a>
        </nav>
        <div class="nav-actions">
            <button id="theme-toggle" class="btn-icon" title="Alternar Tema"><i class="fa-solid fa-moon"></i></button>
            <button id="btn-login" class="btn-primary"><i class="fa-solid fa-user"></i> <span id="auth-btn-text">Entrar</span></button>
            <button id="btn-admin" class="btn-secondary hidden"><i class="fa-solid fa-shield-halved"></i> Painel ADM</button>
        </div>
    </header>

    <main style="padding-top: 100px;">
        <section id="feed" class="container-section">
            <h2 class="section-title"><i class="fa-solid fa-comments"></i> Feed da <span class="highlight">Comunidade</span></h2>
            <div class="glass-card feed-box">
                <div class="post-creator">
                    <textarea id="post-input" placeholder="Compartilhe uma jogada, estratégia ou resultado de treino..."></textarea>
                    <button id="btn-post" class="btn-primary"><i class="fa-solid fa-paper-plane"></i> Publicar</button>
                </div>
                <div id="posts-container" class="posts-list"></div>
            </div>
        </section>
    </main>

    <!-- Modal de Login/Cadastro -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content glass-card">
            <button class="close-modal-btn">&times;</button>
            <h2 id="modal-title">Acessar Viking Hub</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required placeholder="seuemail@codm.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" id="auth-submit-btn" class="btn-primary btn-full">Entrar</button>
            </form>
            <p style="margin-top: 15px; text-align: center;">
                <a href="#" id="toggle-auth-mode" style="color: var(--gold-primary);">Cadastre-se</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- SDK do Firebase Storage -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
