<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIKING eSports Hub</title>
    <!-- Fontes & Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
           1. ESTILOS DO SITE PRINCIPAL (VISÃO DE USUÁRIO COMUM)
           ========================================================================== */
        :root {
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;

            --bg-main: #000000;
            --bg-card: rgba(12, 12, 12, 0.88);
            --border-card: rgba(255, 255, 255, 0.12);
            
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #666666;

            --gold-primary: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.22);
            --gold-border: rgba(212, 175, 55, 0.35);
            --danger-red: #dc2626;
            
            --radius-sm: 6px;
            --radius-md: 12px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 18px;
            min-height: 100vh;
        }

        h1, h2, h3, h4 { font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 1.5px; }
        button { font-family: var(--font-heading); cursor: pointer; border: none; outline: none; }
        .hidden { display: none !important; }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            padding: 25px;
        }

        /* Interface Normal de Usuário */
        .navbar {
            height: 70px; padding: 0 5%; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-card); background: rgba(0, 0, 0, 0.95); position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { font-size: 20px; font-weight: 900; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 15px; }
        .nav-links a.active, .nav-links a:hover { color: var(--gold-primary); }

        .main-layout { padding: 40px 5%; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .feed-post { background: var(--bg-card); border: 1px solid var(--border-card); padding: 20px; border-radius: var(--radius-sm); margin-bottom: 15px; }
        .post-author { color: var(--gold-primary); font-weight: 700; font-size: 14px; margin-bottom: 6px; }

        /* Botões do Sistema */
        .btn-primary { background: #ffffff; color: #000; padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 800; }
        .btn-primary:hover { background: var(--gold-primary); }
        .btn-secondary { background: rgba(212, 175, 55, 0.1); color: var(--gold-primary); border: 1px solid var(--gold-border); padding: 6px 12px; border-radius: var(--radius-sm); }
        .btn-danger { background: rgba(220, 38, 38, 0.15); color: var(--danger-red); border: 1px solid rgba(220, 38, 38, 0.4); padding: 6px 12px; border-radius: var(--radius-sm); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-full { width: 100%; }

        /* ==========================================================================
           2. ESTILOS EXCLUSIVOS GOD MODE (PAINEL FLUTUANTE)
           ========================================================================== */
        .btn-god-trigger {
            position: fixed; bottom: 25px; right: 25px;
            background: #000000; color: var(--gold-primary);
            border: 1px solid var(--gold-primary); padding: 10px 18px;
            border-radius: 50px; font-weight: 800; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 0 15px var(--gold-glow); z-index: 999;
            transition: var(--transition-normal);
        }
        .btn-god-trigger:hover {
            background: var(--gold-primary); color: #000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); transform: translateY(-3px) scale(1.05);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
        }

        .god-card {
            width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; position: relative;
            border: 1px solid var(--gold-primary) !important;
            box-shadow: 0 0 40px var(--gold-glow) !important;
        }

        .close-modal-btn { position: absolute; top: 16px; right: 20px; font-size: 28px; cursor: pointer; color: var(--text-muted); }
        .close-modal-btn:hover { color: var(--gold-primary); }

        .god-header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-card); }
        .god-badge {
            display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800;
            letter-spacing: 2px; color: var(--gold-primary); background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--gold-border); padding: 3px 12px; border-radius: 20px;
        }

        .god-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .god-stat-box { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-card); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
        .stat-label { display: block; font-size: 11px; color: var(--text-muted); }
        .stat-value { font-family: var(--font-heading); font-size: 20px; font-weight: 800; }

        .admin-tabs { display: flex; gap: 8px; margin: 18px 0; border-bottom: 1px solid var(--border-card); padding-bottom: 10px; }
        .tab-btn { background: transparent; color: var(--text-muted); padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; }
        .tab-btn.active { background: #ffffff; color: #000; font-weight: 800; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
        .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid var(--border-card); font-size: 14px; }
        
        .god-actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
        .god-action-card { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-card); padding: 18px; border-radius: var(--radius-sm); }
        .god-action-card input { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-card); padding: 8px; color: #fff; width: 100%; margin: 10px 0; }
    </style>
</head>
<body>

    <!-- 1. NAVEGAÇÃO NORMAL DO SITE (PÚBLICA) -->
    <header class="navbar">
        <div class="nav-logo">VIKING <span style="color: var(--gold-primary);">eSports</span></div>
        <ul class="nav-links">
            <li><a href="#" class="active">Feed Global</a></li>
            <li><a href="#">Torneios</a></li>
            <li><a href="#">Leaderboard</a></li>
            <li><a href="#">Comunidade</a></li>
        </ul>
        <div id="userProfileTag" style="font-size: 14px; color: var(--text-secondary);">
            <i class="fas fa-user-circle"></i> Logado: <span id="currentUserEmail">Carregando...</span>
        </div>
    </header>

    <!-- 2. CONTEÚDO DO SITE (O QUE QUALQUER USUÁRIO VÊ E NAVEGA) -->
    <main class="main-layout">
        <section>
            <h2 style="font-size: 20px; margin-bottom: 20px;"><i class="fas fa-stream"></i> Movimentação Recente</h2>
            
            <div id="userFeedContainer">
                <!-- Posts visíveis na plataforma -->
            </div>
        </section>

        <aside>
            <div class="glass-card" style="margin-bottom: 20px;">
                <h3 style="font-size: 16px; margin-bottom: 10px;"><i class="fas fa-trophy"></i> Campeonato Ativo</h3>
                <p style="font-size: 14px; color: var(--text-secondary);">Torneio Viking Vanguard 2026</p>
                <button class="btn-primary btn-full btn-sm" style="margin-top: 15px;">Ver Chaves</button>
            </div>

            <div class="glass-card">
                <h3 style="font-size: 16px; margin-bottom: 10px;"><i class="fas fa-signal"></i> Status</h3>
                <p style="font-size: 13px; color: var(--text-muted);">Servidores da América do Sul operando normalmente.</p>
            </div>
        </aside>
    </main>

    <!-- 3. PAINEL GOD MODE (SOMENTE INJETADO VIA JS PARA fallk.codm@gmail.com) -->
    <div id="godAdminContainer"></div>

    <script>
        /* ==========================================================================
           LÓGICA DE SEGURANÇA E ACESSO EXCLUSIVO AO GOD MODE
           ========================================================================== */

        // E-mail supremo do criador
        const SUPREME_GOD_EMAIL = "fallk.codm@gmail.com";

        // Simulação do usuário logado na sessão atual
        let currentUser = {
            email: "fallk.codm@gmail.com", // Altere aqui para testar o comportamento em contas comuns
            name: "Tassiano"
        };

        // Banco de Dados Simulado
        let usersDatabase = [
            { id: "001", name: "Tassiano (Viking)", role: "GOD_ADM", status: "Active" },
            { id: "002", name: "Thor_eSports", role: "Player", status: "Active" },
            { id: "003", name: "Loki_Cheater", role: "Player", status: "Banned" }
        ];

        let globalFeedPosts = [
            { id: 101, author: "Thor_eSports", content: "Partida incrível na final hoje!", date: "18:30" },
            { id: 102, author: "Loki_Cheater", content: "GG WP a todos os participantes.", date: "17:10" }
        ];

        // Checagem estrita de credenciais
        function isSupremeGod() {
            return currentUser && currentUser.email && currentUser.email.toLowerCase() === SUPREME_GOD_EMAIL.toLowerCase();
        }

        // Inicialização do site
        document.addEventListener("DOMContentLoaded", () => {
            // Exibe e-mail no cabeçalho
            document.getElementById("currentUserEmail").innerText = currentUser.email;

            // Renderiza o feed visível no site para qualquer usuário
            renderPublicFeed();

            // SE for a sua conta, monta e libera o Painel God Mode no DOM
            if (isSupremeGod()) {
                initGodModeUI();
            } else {
                console.log("[SISTEMA]: Modo Usuário Padrão Ativo.");
            }
        });

        // Atalho de Teclado Supremo (Ctrl + Shift + G) para abrir de qualquer lugar
        document.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'g') {
                e.preventDefault();
                if (isSupremeGod()) {
                    toggleGodPanel();
                }
            }
        });

        /* ==========================================================================
           CONSTRUÇÃO DINÂMICA DO GOD MODE (EXCLUSIVO)
           ========================================================================== */

        function initGodModeUI() {
            const container = document.getElementById("godAdminContainer");
            
            // Injeta o HTML do botão flutuante e do Modal do Painel de Controle
            container.innerHTML = `
                <button class="btn-god-trigger" id="btnGodTrigger" onclick="toggleGodPanel()">
                    <i class="fas fa-crown"></i>
                    <span>GOD MODE</span>
                </button>

                <div class="modal-overlay hidden" id="godAdminModal">
                    <div class="glass-card god-card">
                        <span class="close-modal-btn" onclick="toggleGodPanel()">&times;</span>
                        
                        <div class="god-header">
                            <div class="god-badge"><i class="fas fa-shield-alt"></i> SUPREME AUTHORITY</div>
                            <h2>PAINEL SUPREMO DE MODERAÇÃO</h2>
                            <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Gerenciando como: fallk.codm@gmail.com | Atalho: Ctrl+Shift+G</p>
                        </div>

                        <div class="god-stats-grid">
                            <div class="god-stat-box"><span class="stat-label">Usuários</span><span class="stat-value">1,420</span></div>
                            <div class="god-stat-box"><span class="stat-label">Banidos</span><span class="stat-value" style="color:var(--danger-red)">12</span></div>
                            <div class="god-stat-box"><span class="stat-label">Carga</span><span class="stat-value" style="color:var(--gold-primary)">12%</span></div>
                            <div class="god-stat-box"><span class="stat-label">Servidor</span><span class="stat-value" style="color:#10b981">ONLINE</span></div>
                        </div>

                        <div class="admin-tabs">
                            <button class="tab-btn active" onclick="switchAdminTab('usersTab', event)">Gerenciar Jogadores</button>
                            <button class="tab-btn" onclick="switchAdminTab('feedTab', event)">Moderar Feed</button>
                            <button class="tab-btn" onclick="switchAdminTab('systemTab', event)">Comandos Supremos</button>
                        </div>

                        <div id="usersTab" class="tab-content active">
                            <table class="admin-table">
                                <thead>
                                    <tr><th>ID</th><th>Atleta</th><th>Cargo</th><th>Status</th><th>Ação</th></tr>
                                </thead>
                                <tbody id="usersTableBody"></tbody>
                            </table>
                        </div>

                        <div id="feedTab" class="tab-content">
                            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                                <h3>Feed em Tempo Real</h3>
                                <button class="btn-danger btn-sm" onclick="godClearAllPosts()"><i class="fas fa-skull"></i> PURGAR TUDO</button>
                            </div>
                            <div id="adminFeedList"></div>
                        </div>

                        <div id="systemTab" class="tab-content">
                            <div class="god-actions-grid">
                                <div class="god-action-card">
                                    <h4>Alerta Global</h4>
                                    <p style="font-size:12px; color:var(--text-secondary)">Notificação na tela de todos online.</p>
                                    <input type="text" id="godGlobalNotice" placeholder="Mensagem...">
                                    <button class="btn-primary btn-full btn-sm" onclick="godBroadcastNotice()">Transmitir</button>
                                </div>
                                <div class="god-action-card">
                                    <h4>Resetar Campeonatos</h4>
                                    <p style="font-size:12px; color:var(--text-secondary)">Zera todas as tabelas públicas.</p>
                                    <button class="btn-secondary btn-full btn-sm" onclick="godResetLeaderboard()">Zerar Tabela</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        // Abrir/Fechar Modal
        function toggleGodPanel() {
            if (!isSupremeGod()) return;
            const modal = document.getElementById('godAdminModal');
            if (modal) {
                modal.classList.toggle('hidden');
                if (!modal.classList.contains('hidden')) {
                    renderUsersTable();
                    renderAdminFeed();
                }
            }
        }

        // Alternar Abas
        function switchAdminTab(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        /* ==========================================================================
           AÇÕES DE MODERAÇÃO EM TEMPO REAL
           ========================================================================== */

        // Renderiza o feed que QUALQUER usuário vê na tela
        function renderPublicFeed() {
            const container = document.getElementById('userFeedContainer');
            container.innerHTML = '';
            
            if (globalFeedPosts.length === 0) {
                container.innerHTML = `<div class="feed-post"><p style="color:var(--text-muted)">Nenhuma publicação no momento.</p></div>`;
                return;
            }

            globalFeedPosts.forEach(post => {
                const el = document.createElement('div');
                el.className = 'feed-post';
                el.innerHTML = `
                    <div class="post-author">@${post.author} <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">• ${post.date}</span></div>
                    <p style="font-size:15px;">${post.content}</p>
                `;
                container.appendChild(el);
            });
        }

        // Tabela de Usuários no Painel ADM
        function renderUsersTable() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            usersDatabase.forEach(user => {
                const isBanned = user.status === 'Banned';
                const isGod = user.role === 'GOD_ADM';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${user.id}</td>
                    <td><strong>${user.name}</strong></td>
                    <td>${user.role}</td>
                    <td><span style="color:${isBanned ? 'var(--danger-red)' : '#10b981'}">${user.status}</span></td>
                    <td>
                        ${!isGod ? `
                            <button class="btn-danger btn-sm" onclick="godToggleBan('${user.id}')">
                                ${isBanned ? 'Desbanir' : 'BANIR'}
                            </button>
                        ` : '<span style="font-size:11px; color:var(--text-muted)">DONO</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Moderar Feed pelo Painel ADM
        function renderAdminFeed() {
            const container = document.getElementById('adminFeedList');
            container.innerHTML = '';

            globalFeedPosts.forEach(post => {
                const item = document.createElement('div');
                item.style.cssText = "background:rgba(0,0,0,0.5); padding:10px; margin-bottom:8px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;";
                item.innerHTML = `
                    <div><strong>@${post.author}</strong>: ${post.content}</div>
                    <button class="btn-danger btn-sm" onclick="godDeletePost(${post.id})"><i class="fas fa-trash"></i></button>
                `;
                container.appendChild(item);
            });
        }

        function godToggleBan(userId) {
            if (!isSupremeGod()) return;
            const user = usersDatabase.find(u => u.id === userId);
            if (user) {
                user.status = user.status === 'Banned' ? 'Active' : 'Banned';
                renderUsersTable();
            }
        }

        function godDeletePost(postId) {
            if (!isSupremeGod()) return;
            globalFeedPosts = globalFeedPosts.filter(p => p.id !== postId);
            renderAdminFeed();
            renderPublicFeed(); // Atualiza a visão pública do site instantaneamente
        }

        function godClearAllPosts() {
            if (!isSupremeGod()) return;
            if (confirm("PODER SUPREMO: Limpar todo o Feed da plataforma?")) {
                globalFeedPosts = [];
                renderAdminFeed();
                renderPublicFeed(); // Atualiza o site público
            }
        }

        function godBroadcastNotice() {
            if (!isSupremeGod()) return;
            const text = document.getElementById('godGlobalNotice').value;
            if (!text) return;
            alert(`[ANÚNCIO SUPREMO TRANSITADO PARA O SITE]:\n\n"${text.toUpperCase()}"`);
            document.getElementById('godGlobalNotice').value = '';
        }

        function godResetLeaderboard() {
            if (!isSupremeGod()) return;
            alert("[GOD MODE]: Tabela de classificação pública resetada.");
        }
    </script>
</body>
</html>
