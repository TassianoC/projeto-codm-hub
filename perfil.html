<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIKING eSports Hub | Meu Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-shield-halved highlight"></i>
            <span>VIKING <span class="highlight">HUB</span></span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="regras.html">Regras</a>
            <a href="modos.html">Modos</a>
            <a href="agenda.html">Agenda</a>
            <a href="ranking.html">Ranking</a>
            <a href="comunidade.html">Comunidade</a>
            <a href="perfil.html" id="nav-profile-link" class="highlight-link active"><i class="fa-solid fa-user"></i> Meu Perfil</a>
            <a href="#" id="nav-admin-link" class="highlight-link" style="color: var(--gold-primary) !important;"><i class="fa-solid fa-lock"></i> ADM</a>
        </nav>
        <div class="nav-actions">
            <button id="theme-toggle" class="btn-icon" title="Alternar Tema"><i class="fa-solid fa-moon"></i></button>
            <button id="btn-login" class="btn-primary"><i class="fa-solid fa-user"></i> <span id="auth-btn-text">Entrar</span></button>
            <button id="btn-admin" class="btn-secondary"><i class="fa-solid fa-shield-halved"></i> Painel ADM</button>
        </div>
    </header>

    <main style="padding-top: 100px;">
        <section id="profile-section" class="container-section profile-page">
            <h2 class="section-title"><i class="fa-solid fa-address-card"></i> Perfil do <span class="highlight">Guerreiro</span></h2>
            <div class="profile-layout">
                <div class="glass-card profile-sidebar">
                    <div class="avatar-container">
                        <img src="/img/studio (3).png" alt="Avatar do Jogador" id="display-avatar" class="profile-avatar">
                    </div>
                    <h3 id="display-nickname">Seu Nickname</h3>
                    <span class="role-badge" id="display-role">Sniper</span>
                    <p id="display-bio" class="user-bio">Sua biografia aparecerá aqui...</p>
                    <button id="btn-edit-profile-modal" class="btn-outline btn-full margin-top"><i class="fa-solid fa-user-pen"></i> Editar Perfil</button>
                </div>
                <div class="profile-main-content">
                    <div class="glass-card margin-bottom-card">
                        <div class="card-header-flex">
                            <h3><i class="fa-solid fa-trophy highlight"></i> Minhas Conquistas</h3>
                            <button id="btn-add-achievement" class="btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Adicionar Conquista</button>
                        </div>
                        <div id="user-achievements-grid" class="user-trophy-grid"></div>
                    </div>
                    <div class="glass-card">
                        <h3><i class="fa-solid fa-rss highlight"></i> Minhas Publicações</h3>
                        <div class="post-creator margin-top">
                            <textarea id="user-post-input" placeholder="O que você está aprontando no CODM hoje?"></textarea>
                            <button id="btn-user-post" class="btn-primary"><i class="fa-solid fa-paper-plane"></i> Publicar no Meu Feed</button>
                        </div>
                        <div id="user-posts-list" class="posts-list margin-top"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Editar Perfil -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content glass-card">
            <button class="close-profile-modal close-modal-btn">&times;</button>
            <h2>Editar Perfil</h2>
            <form id="profile-form">
                <div class="input-group">
                    <label>Nickname / Tag</label>
                    <input type="text" id="profile-nickname" required placeholder="Ex: Viking_Viper">
                </div>
                <div class="input-group">
                    <label>Função / Role</label>
                    <select id="profile-role">
                        <option value="Sniper">Sniper</option>
                        <option value="Rusher">Rusher</option>
                        <option value="Suporte">Suporte</option>
                        <option value="Capitão">Capitão / IGL</option>
                        <option value="Flex">Flexível</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>URL do Avatar (Imagem)</label>
                    <input type="text" id="profile-avatar" placeholder="https://link-da-imagem.com/foto.png">
                </div>
                <div class="input-group">
                    <label>Biografia / Descrição</label>
                    <textarea id="profile-bio" rows="3" placeholder="Fale brevemente sobre sua trajetória..."></textarea>
                </div>
                <button type="submit" class="btn-primary btn-full">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <!-- Modal Adicionar Conquista -->
    <div id="achievement-modal" class="modal hidden">
        <div class="modal-content glass-card">
            <button class="close-achievement-modal close-modal-btn">&times;</button>
            <h2>Adicionar Conquista</h2>
            <form id="achievement-form">
                <div class="input-group">
                    <label>Título da Conquista</label>
                    <input type="text" id="ach-title" required placeholder="Ex: Campeão do Torneio X">
                </div>
                <div class="input-group">
                    <label>Descrição</label>
                    <input type="text" id="ach-desc" required placeholder="Ex: 1º Lugar na Season 1">
                </div>
                <div class="input-group">
                    <label>Ícone FontAwesome (Ex: fa-trophy, fa-award, fa-crown)</label>
                    <input type="text" id="ach-icon" placeholder="fa-trophy">
                </div>
                <button type="submit" class="btn-primary btn-full">Salvar Conquista</button>
            </form>
        </div>
    </div>

    <!-- Modal de Login -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content glass-card">
            <button class="close-modal-btn">&times;</button>
            <h2 id="modal-title">Acessar Viking Hub</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required placeholder="seuemail@codm.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" id="auth-submit-btn" class="btn-primary btn-full">Entrar</button>
            </form>
            <p style="margin-top: 15px; text-align: center;">
                <a href="#" id="toggle-auth-mode" style="color: var(--gold-primary);">Cadastre-se</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
